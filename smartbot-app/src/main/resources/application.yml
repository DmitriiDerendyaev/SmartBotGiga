spring:
  application:
    name: smartbot
  datasource:
    url: ${SMARTBOT_DB_URL:jdbc:postgresql://localhost:5432/smartbot}
    username: ${SMARTBOT_DB_USERNAME:smartbot}
    # Без дефолта: приложение должно падать при отсутствии инъекции секрета (fail-fast)
    password: ${SMARTBOT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SMARTBOT_SERVER_PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${SMARTBOT_MANAGEMENT_PORT:9090}
    # Actuator не торчит наружу: только loopback внутри контейнера/хоста.
    # Prometheus scrape — через внутреннюю сеть (Phase 7), не через публичный порт.
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
  info:
    env:
      enabled: false
    git:
      enabled: false
    build:
      enabled: false

# Секреты (Telegram bot token, GigaChat Authorization Key) НИКОГДА не хранятся здесь.
# Они поступают из Infisical / защищённых переменных окружения (Phase 4, 7).
smartbot:
  telegram:
    polling-enabled: false # включается после проверки VPN-маршрута (Epic 5)
    poll-timeout-seconds: 25
    # bot-token — только из env/Infisical: SMARTBOT_TELEGRAM_BOT_TOKEN
    bot-token: ${SMARTBOT_TELEGRAM_BOT_TOKEN:}
  llm:
    provider: gigachat
  search:
    mode: NONE # NONE | NATIVE | EXTERNAL | AUTO (Phase 5)

logging:
  level:
    ru.smartbot: INFO
    # Wire-логи HTTP-клиентов могут содержать bot token в URL (AD-4, SEC-06)
    reactor.netty: WARN
    org.springframework.web.reactive.function.client: WARN
