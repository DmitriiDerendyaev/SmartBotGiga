# Локальная среда разработки: только инфраструктурные сервисы.
# Приложение запускается отдельно (make run) или в полном compose (docker-compose.yml).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartbot
      POSTGRES_USER: smartbot
      POSTGRES_PASSWORD: ${SMARTBOT_DB_PASSWORD:-smartbot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbot -d smartbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis — опционально (initSpec.md §3: "if justified").
  # Включается профилем: docker compose --profile cache up -d
  redis:
    image: redis:8-alpine
    profiles: ["cache"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
